<html lang="en">
<head>

<title>ETA: buying an accounting firm · Zazoo demo</title>
<meta name="description" content="An interactive Zazoo prototype for an entrepreneurship-through-acquisition founder searching for an accounting firm to buy, with made-up listings, brokers and books.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
// A made-up ETA founder (entrepreneurship through acquisition) searching for one accounting firm to
// buy with an SBA loan, then run. Every listing is measured against her thesis; the firm under LOI
// is checked from its seller's QuickBooks exports.
let s = 31
const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647
const int = (lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1))
const pick = (a) => a[Math.floor(rnd() * a.length)]
const TODAY = '2026-11-02'
const add = (n) => new Date(new Date(TODAY + 'T12:00:00').getTime() + n * 864e5).toISOString().slice(0, 10)
const n0 = (v) => Math.round(v).toLocaleString()
const K = (v) => '$' + Z.compact(v)

// the region: a home city and the towns within a 90-minute drive
const HOME = [38.95, -92.33]
const TOWNS = [['Ashby', 38.95, -92.33], ['Millbrook', 38.58, -92.17], ['Crane Falls', 39.21, -92.86], ['Ellsworth', 38.71, -93.23], ['Port Hadley', 39.12, -91.62], ['Linwood', 38.36, -92.62], ['Oak Bend', 39.43, -92.31], ['Sumner', 38.62, -91.48]]
const SOURCES = [['Ledgerline Practice Brokers', 'Practice broker', 'Accounting practices, four states', 'Working'], ['CPA Transitions Group', 'Practice broker', 'CPA firms, nationwide', 'Working'], ['Keystone Accounting Brokers', 'Practice broker', 'Tax and bookkeeping, the region', 'Working'], ['Harbor Business Advisors', 'Business broker', 'Main street businesses, the region', 'Working'], ['MarketBiz listings', 'Marketplace', 'Every business for sale, filtered to accounting', 'Working'], ['DealFlow Aggregator', 'Aggregator', 'Listings from 40 brokers', 'Needs your sign-in'], ['Practice Exchange', 'Marketplace', 'Accounting practices, nationwide', 'Working'], ['Owner letters', 'Person', 'Firms you wrote to, not for sale', 'Working']]
const sources = SOURCES.map(([name, kind, coverage, state], i) => ({ id: 'so' + i, name, kind, coverage, state, on: i === 5 ? 'Off' : 'On', last: add(i === 5 ? -9 : 0), found: 0, fresh: 0 }))

// the thesis and the financing, as she wrote them
const TH = { revLo: 750000, revHi: 3000000, margin: 28, mult: 1.25, dscr: 1.5, stressed: 1.25, miles: 75, recurring: 60 }
const FIN = { injection: 0.1, note: 0.1, noteRate: 0.06, noteYears: 5, sbaRate: 0.105, sbaYears: 10, pay: 110000, loss: 0.15 }
const pmt = (p, r, y) => (p * (r / 12)) / (1 - Math.pow(1 + r / 12, -y * 12)) * 12
const figures = (d) => {
  const price = d.price, loan = price * (1 - FIN.injection - FIN.note), note = price * FIN.note
  const ds = pmt(loan, FIN.sbaRate, FIN.sbaYears) + pmt(note, FIN.noteRate, FIN.noteYears)
  const dscr = (d.sde - FIN.pay) / ds, stressed = (d.sde - FIN.pay - d.rev * FIN.loss * 0.4) / ds
  return { loan, note, injection: price * FIN.injection, ds, dscr: Math.round(dscr * 100) / 100, stressed: Math.round(stressed * 100) / 100, margin: Math.round((d.sde / d.rev) * 1000) / 10, mult: Math.round((price / d.rev) * 100) / 100, multSde: Math.round((price / d.sde) * 100) / 100, after: d.sde - ds }
}
const checks = (d) => {
  const f = figures(d)
  return [
    { name: 'Revenue $750K to $3M', v: K(d.rev), ok: d.rev >= TH.revLo && d.rev <= TH.revHi },
    { name: 'SDE margin 28%+', v: f.margin + '%', ok: f.margin >= TH.margin },
    { name: 'Price at most 1.25× revenue', v: f.mult + '×', ok: f.mult <= TH.mult },
    { name: 'DSCR 1.5+ at the asking price', v: f.dscr, ok: f.dscr >= TH.dscr },
    { name: 'DSCR 1.25+ if 15% of clients leave', v: f.stressed, ok: f.stressed >= TH.stressed },
    { name: 'Recurring work 60%+', v: d.recurring + '%', ok: d.recurring >= TH.recurring },
    { name: 'Within 90 minutes of Ashby', v: d.miles + ' mi', ok: d.miles <= TH.miles },
  ]
}
const fitOf = (d) => { const miss = checks(d).filter((c) => !c.ok).length; return miss === 0 ? 'Fits your thesis' : miss === 1 ? 'One miss' : 'Outside your thesis' }
const STAGES = ['New', 'Pending questions', 'CIM requested', 'CIM reviewed', 'Call', 'LOI sent', 'Diligence', 'Closed', 'Passed']
const NAMES = ['Morrow & Pike CPAs', 'Linwood Tax & Books', 'Crane Falls Accounting', 'Halden CPA Group', 'Oak Bend Tax Service', 'Sumner Bookkeeping Co.', 'Ellsworth & Vance', 'Port Hadley CPAs', 'Riverside Payroll & Tax', 'Ashby Advisory Partners', 'Greer Accounting', 'North County CPAs', 'Pruitt & Associates', 'Millbrook Tax Pros', 'Westgate Accounting', 'Caldwell CPA', 'Fenwick Books', 'Tri-County Tax', 'Hollis & Grant CPAs', 'Bluestem Accounting', 'Kessler Tax Group', 'Meadowlark CPAs']
const STAGE_OF = [6, 0, 3, 4, 1, 0, 2, 5, 0, 4, 8, 0, 1, 3, 0, 8, 2, 0, 1, 0, 2, 0]
const deals = NAMES.map((name, i) => {
  const [town, la, ln] = TOWNS[i % TOWNS.length], rev = int(7, 28) * 100000, margin = 0.27 + rnd() * 0.13
  const d = { id: 'd' + i, name, town, lat: la + (rnd() - 0.5) * 0.12, lng: ln + (rnd() - 0.5) * 0.14, src: SOURCES[i % 7][0], sid: 'so' + (i % 7), listing: `${['LL', 'CT', 'KA', 'HB', 'MB', 'DF', 'PX'][i % 7]}-${int(1000, 9999)}`,
    rev, sde: Math.round(rev * margin / 1000) * 1000, price: Math.round(rev * (0.82 + rnd() * 0.4) / 5000) * 5000, staff: int(3, 16), clients: int(180, 1400), recurring: int(54, 88),
    miles: int(4, 95), stage: STAGES[STAGE_OF[i]], status: i === 15 ? 'Sold' : i === 10 ? 'Under LOI' : 'Listed', found: add(-int(1, 110)) }
  return d
})
// the firm under LOI, and one that looks good but fails the stress test
Object.assign(deals[0], { town: 'Ashby', lat: 38.97, lng: -92.3, rev: 1240000, sde: 436000, price: 1290000, staff: 9, clients: 640, recurring: 78, miles: 6, status: 'Under LOI' })
Object.assign(deals[7], { rev: 1580000, sde: 540000, price: 1940000, recurring: 71, miles: 44 })
Object.assign(deals[3], { rev: 980000, sde: 372000, price: 1010000, recurring: 74, miles: 58 })
Object.assign(deals[9], { rev: 2100000, sde: 690000, price: 2350000, recurring: 81, miles: 12 })
;[1, 5, 11].forEach((i, k) => (deals[i].found = add(-2 - k * 2)))
const refresh = (rows) => rows.forEach((d) => { const f = figures(d); Object.assign(d, { margin: f.margin, mult: f.mult, dscr: f.dscr, stressed: f.stressed, ds: Math.round(f.ds), loan: Math.round(f.loan), fit: fitOf(d) }) })
refresh(deals)
sources.forEach((so) => { so.found = deals.filter((d) => d.sid === so.id).length * 3 + int(0, 6); so.fresh = int(0, 2) })
sources[7].found = 4

// the CRM: the firms she is talking to, a search's stages from sourced to closed
const PHASES = ['Sourced', 'First contact', 'NDA signed', 'CIM / info review', 'Management call', 'IOI', 'LOI', 'Due diligence', 'Closing', 'Closed', 'Passed']
const BROKERS = [['Dana Whitfield', 'Ledgerline Practice Brokers'], ['Marcus Lee', 'CPA Transitions Group'], ['Ruth Ambrose', 'Keystone Accounting Brokers'], ['Owen Clarke', 'Harbor Business Advisors']]
const LEAD_OF = [[0, 'Due diligence'], [7, 'LOI'], [9, 'Management call'], [3, 'CIM / info review'], [13, 'CIM / info review'], [2, 'NDA signed'], [16, 'NDA signed'], [12, 'First contact'], [4, 'First contact'], [18, 'Sourced'], [10, 'Passed'], [15, 'Passed']]
const NEXT = ['QofE fieldwork', 'Seller answers on staff', 'Second call with the seller', 'Model the client list', 'Questions to the broker', 'Ask for the CIM', 'Read the CIM', 'Intro call', 'Sign the NDA', 'Owner letter', '—', '—']
const leads = LEAD_OF.map(([di, phase], i) => {
  const d = deals[di], f = figures(d), [broker, firm] = BROKERS[i % 4]
  return { id: 'l' + i, did: d.id, company: d.name, phase, broker: di === 4 || di === 18 ? 'Owner, direct' : broker, firm: di === 4 || di === 18 ? 'Owner letters' : firm, next: NEXT[i], nextDate: add([3, 1, 2, 5, -2, 4, 6, 1, 0, 8, 0, 0][i]), price: d.price, rev: d.rev, sde: d.sde,
    offer: ['Due diligence', 'LOI'].includes(phase) ? Math.round(d.price * 0.93 / 5000) * 5000 : null, walk: ['Due diligence', 'LOI', 'Management call'].includes(phase) ? Math.round(d.rev * 1.08 / 5000) * 5000 : null, dscr: f.dscr, stressed: f.stressed,
    excl: phase === 'Due diligence' ? add(38) : null, email: broker.toLowerCase().replace(/ /g, '.') + '@example.com' }
})
const MKINDS = ['New listing', 'Teaser', 'NDA to sign', 'CIM or data room', 'Questions', 'Seller answers', 'Call', 'LOI', 'Lender', 'Attorney', 'Under LOI elsewhere']
const mail = Array.from({ length: 26 }, (_, i) => {
  const l = leads[i % leads.length], kind = MKINDS[(i * 7) % MKINDS.length]
  return { id: 'm' + i, subject: `${kind === 'New listing' ? 'New: accounting practice, ' + deals[(i + 5) % 22].town : kind + ' · ' + l.company}`, from: l.email, received: add(-int(0, 21)), kind, lead: l.company, lid: l.id,
    did: kind === 'New listing' ? 'Read the listing into Deals' : kind === 'CIM or data room' ? 'Filed the CIM on the deal; Document reader read it' : kind === 'NDA to sign' ? 'Waiting for your signature' : 'Filed on the lead', state: kind === 'NDA to sign' || kind === 'Questions' ? 'Waiting for you' : 'Filed' }
})

// the firm in diligence: its clients and its books, from the seller's QuickBooks exports
const target = deals[0]
const IND = ['Construction', 'Medical practice', 'Restaurant', 'Farm', 'Retail', 'Trucking', 'Individual', 'Nonprofit', 'Real estate', 'Dental']
const SERV = ['Tax', 'Tax and books', 'Monthly books', 'Payroll', 'Advisory']
const CLN = ['Hartley Construction', 'Pine Valley Dental', 'Beck Family Farms', 'Ruiz Trucking', 'Ashby Medical Group', 'Corner Table Bistro', 'Larkin Realty', 'St. Brigid Food Pantry', 'Wexler Hardware', 'Delgado Roofing', 'Monroe Orthodontics', 'Tallgrass Farms', 'Kim & Sons Market', 'Bower Electric', 'Grain Haul LLC', 'Riverbend Clinic', 'Sato Family (individual)', 'Patel Holdings', 'Oak Street Cafe', 'Hughes Plumbing', 'Cedar Ridge Rentals', 'Ng Family (individual)', 'Foster Feed & Seed', 'Brightside Daycare']
const clients = CLN.map((name, i) => {
  const serv = SERV[i % 5], fees = [62000, 48000, 41000, 39000, 36000][i] || int(6, 30) * 1000
  return { id: 'c' + i, name, industry: IND[i % IND.length], serv, fees, years: int(1, 22), seller: i % 3 === 0 ? 'Yes' : 'No', risk: i === 0 || i === 4 ? 'High' : i % 3 === 0 ? 'Watch' : 'Low', since: String(2026 - int(1, 22)) }
})
const MONTHS = ['Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct']
const SEASON = [0.78, 0.82, 1.18, 1.42, 1.62, 1.48, 0.82, 0.74, 0.72, 0.76, 0.92, 0.74]
const books = MONTHS.map((m, i) => {
  const rev = Math.round(target.rev / 12 * SEASON[i] / 100) * 100, pay = Math.round((52000 + (i >= 2 && i <= 5 ? 9000 : 0)) / 100) * 100, rent = 4200, other = Math.round(rev * 0.07 / 100) * 100
  return { id: 'b' + i, month: m, rev, pay, rent, other, owner: 15000, sde: rev - pay - rent - other + 1250, check: i === 3 ? 'Flag' : 'Ties', cell: `P&L by month · col ${String.fromCharCode(66 + i)}`, note: i === 3 ? 'Revenue $14,200 above the bank deposits: a client prepaid next year' : '' }
})
const flags = [
  ['Top client is 5% of fees, top five 18%', 'Concentration', 'Info', 'Within your thesis (no client above 10%)'],
  ['A third of clients deal only with the seller', 'Retention', 'Open', '8 of 24 named clients; ask for a two-year transition'],
  ['February revenue $14,200 above deposits', 'Books', 'Open', 'A prepayment booked as revenue; QofE to adjust'],
  ['Owner pays a family member $15,000 a year', 'Add-back', 'Accepted', 'Added back to SDE; no role after the sale'],
  ['Lease ends 14 months after close', 'Lease', 'Open', 'Ask the landlord for a five-year option before LOI exclusivity ends'],
  ['Two staff hold the only payroll know-how', 'Staff', 'Open', 'Stay bonuses in the purchase agreement'],
].map(([title, kind, state, note], i) => ({ id: 'f' + i, title, kind, state, note, raised: add(-int(1, 12)) }))

// the search network: deals she brought to peers and advisors, and their verdicts
const reviews = [
  [deals[0].name, 'Search forum', 'Pursue', 'Retention plan for the seller-only clients'],
  [deals[7].name, 'Advisor call', 'Re-price', 'Stressed DSCR under 1.25 at the ask'],
  [deals[9].name, 'Peers', 'More diligence', 'Is the advisory work recurring?'],
  [deals[10].name, 'Search forum', 'Pass', 'Seller wants to leave in 30 days'],
  [deals[3].name, 'Advisor call', 'Pursue', 'Check the payroll software contract'],
].map(([deal, to, verdict, q], i) => ({ id: 'r' + i, deal, to, verdict, q, date: add(-int(2, 50)), by: pick(['Jules Moreno (advisor)', 'Cohort peers', 'Sam Achebe (advisor)']) }))
const BRK = [['Dana Whitfield', 'Ledgerline Practice Brokers', 'Practice broker', 9, 'Warm', 2], ['Marcus Lee', 'CPA Transitions Group', 'Practice broker', 6, 'Warm', 5], ['Ruth Ambrose', 'Keystone Accounting Brokers', 'Practice broker', 5, 'Warm', 1], ['Owen Clarke', 'Harbor Business Advisors', 'Business broker', 3, 'New', 9], ['Nina Patel', 'Practice Exchange', 'Marketplace', 4, 'New', 14], ['Greg Toll', 'Ledgerline Practice Brokers', 'Practice broker', 2, 'Cold', 33], ['Alma Ruiz', 'Midstate M&A Advisors', 'M&A adviser', 1, 'Cold', 41]]
const brokers = BRK.map(([name, firm, kind, sent, warmth, d], i) => ({ id: 'br' + i, name, firm, kind, sent, deals: deals.filter((x) => x.src === firm).length, warmth, last: add(-d), email: name.toLowerCase().replace(/ /g, '.') + '@example.com' }))
const PPL = [['Walter Morrow', 'Seller', 'Morrow & Pike CPAs', 3], ['Jules Moreno', 'Lender', 'Heartland SBA Lending', 1], ['Leah Kim', 'Attorney', 'Kim Deal Law', 4], ['Ravi Shah', 'QofE', 'Shah Diligence Partners', 2], ['Sam Achebe', 'Advisor', 'Search network', 12], ['Tom Becker', 'Investor', 'Becker Capital', 1], ['Joan Pike', 'Seller', 'Morrow & Pike CPAs', 6], ['Ellen Ford', 'Landlord', 'Ford Properties', 15], ['Ana Duarte', 'Peer', 'Searching: HVAC, Texas', 8], ['Chris Ng', 'Peer', 'Searching: dental labs', 19], ['Mia Halden', 'Seller', 'Halden CPA Group', 0], ['Pete Olsen', 'Insurance', 'Olsen Insurance', 27]]
const contacts = PPL.map(([name, role, firm, d], i) => ({ id: 'p' + i, name, role, firm, last: add(-d), email: name.toLowerCase().replace(/ /g, '.') + '@example.com' }))

// after the close: five years, quarter by quarter, with clients leaving in year one
const fq = Array.from({ length: 20 }, (_, i) => {
  const y = Math.floor(i / 4), keep = i < 4 ? 1 - FIN.loss * ((i + 1) / 4) * 0.6 : 1 - FIN.loss * 0.6, grow = Math.pow(1.06, y)
  const rev = Math.round(target.rev / 4 * keep * grow), sde = Math.round(rev * 0.35 - FIN.pay / 4), ds = Math.round(figures(target).ds / 4)
  return { id: 'q' + i, q: `Y${y + 1} Q${(i % 4) + 1}`, rev, sde, ds, dscr: Math.round((sde / ds) * 100) / 100, cash: 0, note: i === 0 ? 'Seller in transition, 2 days a week' : i === 4 ? 'Seller leaves; advisory line starts' : i === 19 ? 'Seller note paid off' : '' }
})
fq.reduce((a, q) => (q.cash = a + q.sde - q.ds), 0)

const events = [
  ['QofE fieldwork starts: ' + target.name, add(3), 'Diligence', 'Priya Nair'], ['Search forum: deal reviews', add(8), 'Network', 'Priya Nair'], ['Call with the seller of ' + deals[9].name, add(2), 'Call', 'Priya Nair'],
  ['Lender: SBA term sheet due', add(6), 'Lender', 'Jules Moreno'], ['LOI exclusivity ends: ' + target.name, add(38), 'LOI', 'Priya Nair'], ['Investor update', add(13), 'Investor', 'Tom Becker'],
  ['Landlord meeting: lease option', add(10), 'Diligence', 'Priya Nair'], ['Advisor call: purchase agreement', add(16), 'Network', 'Leah Kim'], ['NDA back to Keystone', add(0), 'NDA', 'Priya Nair'],
  ['Read the CIM: ' + deals[13].name, add(4), 'Deal', 'Priya Nair'], ['Staff meeting with the seller', add(21), 'Diligence', 'Priya Nair'], ['Lender site visit', add(24), 'Lender', 'Jules Moreno'],
].map(([title, date, kind, who], i) => ({ id: 'ev' + i, title, date, kind, who }))
const kb = [
  ['My thesis', 'Thesis', 'One accounting firm within 90 minutes of Ashby: $750K to $3M revenue, 28%+ SDE margin, 60%+ recurring work, no client above 10% of fees. I run it myself.'],
  ['How I finance it', 'Financing', '10% my own cash, 10% seller note over 5 years at 6%, the rest an SBA 7(a) loan over 10 years at 10.5%. I pay myself $110,000 before debt service.'],
  ['Why the 15% stress test', 'Method', 'Practices lose 10 to 20% of clients in the first year after a sale, most of them clients who dealt only with the seller. I want DSCR 1.25 even then.'],
  ['What a CPA practice sells for', 'Market', '0.9 to 1.25 times revenue, often with an earn-out on retained clients. Tax-only practices sit at the low end; monthly books and payroll at the high end.'],
  ['First call with a seller', 'Playbook', 'Why sell, why now; who the clients call; what staff know; will they stay two years; what happens in tax season if they are gone.'],
  ['LOI: what I always ask for', 'Template', 'Exclusivity 60 days, a two-year seller transition, a retention-based earn-out on 10% of the price, stay bonuses for key staff, a lease option.'],
  ['Diligence list for an accounting firm', 'Checklist', 'Client list with fees and tenure, engagement letters, staff and their certifications, software and licenses, three years of returns, the lease, malpractice claims.'],
].map(([title, kind, body], i) => ({ id: 'k' + i, title, kind, body, updated: add(-int(2, 80)), by: pick(['Priya Nair', 'Librarian (agent)']) }))

const fitTone = { 'Fits your thesis': 'good', 'One miss': 'warn', 'Outside your thesis': 'bad' }
const stTone = { New: 'o8', 'Pending questions': 'o1', 'CIM requested': 'o1', 'CIM reviewed': 'o3', Call: 'o3', 'LOI sent': 'acc', Diligence: 'acc', Closed: 'good', Passed: 'bad' }
const phTone = { Sourced: 'o8', 'First contact': 'o1', 'NDA signed': 'o1', 'CIM / info review': 'o3', 'Management call': 'o3', IOI: 'o5', LOI: 'acc', 'Due diligence': 'acc', Closing: 'good', Closed: 'good', Passed: 'bad' }
const tables = {
  deals: { name: 'Deals', one: 'deal', title: 'name', rows: deals, sort: ['dscr', 'desc'], view: 'map', board: 'stage', date: 'found',
    lists: [{ name: 'Fits your thesis', tone: 'good', where: (r) => r.fit === 'Fits your thesis', tip: 'Passes all seven checks' }, { name: 'One miss', tone: 'warn', where: (r) => r.fit === 'One miss' }, { name: 'New this week', tone: 'acc', where: (r) => Z.daysFrom(r.found) >= -7 }, { name: 'Passed', where: (r) => r.stage === 'Passed' }],
    sub: (r) => `${Z.esc(r.town)} · ${Z.esc(r.src)} · ${Z.esc(r.listing)} · asking ${Z.money(r.price)}`,
    map: { lat: 'lat', lng: 'lng', color: 'fit', size: 'rev', tip: ['fit', 'price', 'dscr', 'stage'], bounds: { s: 38.2, n: 39.6, w: -93.5, e: -91.3 },
      base: (p) => { const [x, y] = p(HOME[0], HOME[1]), [, y2] = p(HOME[0] + TH.miles / 69, HOME[1]); return `<circle cx="${x}" cy="${y}" r="${Math.abs(y - y2)}" fill="var(--ink)" fill-opacity=".04" stroke="var(--ink)" stroke-opacity=".2" stroke-dasharray="4 4"/>` },
      layers: (p) => TOWNS.map(([n, la, ln]) => { const [x, y] = p(la + 0.07, ln); return `<text x="${x}" y="${y}" text-anchor="middle" font-size="11" font-weight="500" fill="#6f6857" stroke="#fffdf9" stroke-width="3" paint-order="stroke" pointer-events="none">${n}</text>` }).join('') + (() => { const [x, y] = p(HOME[0], HOME[1]); return `<g data-tip="Ashby: home, with the two-hour line"><rect x="${x - 8}" y="${y - 8}" width="16" height="16" rx="4" fill="var(--ink)"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">H</text></g>` })(),
      legend: '<span><i style="background:var(--ink);border-radius:3px"></i>Home, 90-minute line</span>' },
    detail: (r, Z) => {
      const c = checks(r), f = figures(r), miss = c.filter((x) => !x.ok)
      return `${miss.length ? `<div class="callout ${miss.length > 1 ? 'bad' : 'warn'}"><b>${miss.length === 1 ? 'One miss' : miss.length + ' misses'} against your thesis.</b> ${miss.map((x) => `${x.name}: ${x.v}`).join('; ')}.</div>` : ''}
      <div class="sec-t">Your thesis <span class="mute3" style="font-weight:400">· ${7 - miss.length} of 7</span></div><div class="gates">${c.map((x) => `<div class="gate ${x.ok ? 'ok' : 'no'}"><b>${x.ok ? '✓' : '✕'} ${x.v}</b>${x.name}</div>`).join('')}</div>
      <div class="sec-t">At the asking price</div><div class="counts" style="grid-template-columns:repeat(2,1fr);margin:0 0 8px">${Z.count(K(f.injection), 'your cash, 10%')}${Z.count(K(f.loan), 'SBA loan, 80%')}${Z.count(K(f.ds), 'debt service a year')}${Z.count(K(f.after), 'SDE after debt service')}</div>
      <div class="sec-t">DSCR as clients leave</div>${Z.chart.hbar([0, 5, 10, 15, 20, 25].map((l) => { const v = Math.round(((r.sde - FIN.pay - r.rev * (l / 100) * 0.4) / f.ds) * 100) / 100; return { label: `${l}% of clients leave`, value: Math.max(0, v), note: v.toFixed(2), tone: v >= 1.5 ? 'good' : v >= 1.25 ? 'warn' : 'bad' } }), { max: 3, fmt: (v) => v.toFixed(2) })}
      <p class="mute3" style="font-size:12px">SDE less your $110,000 pay, over a year of SBA and seller-note payments. Lenders ask 1.25; your thesis asks 1.5, and 1.25 after losing 15% of clients.</p>`
    },
    fields: [
      { k: 'name', label: 'Firm', src: (r) => `The listing on ${r.src}` },
