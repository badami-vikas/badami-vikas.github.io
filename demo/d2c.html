<script src="app.js"></script>
<script>
// A made-up herbal personal-care brand in Pune: tooth powders, hair oils and packs made from raw
// herbs, sold on WhatsApp, its website and through shops, with GST invoices.
Z.currency = 'INR' // amounts are formatted before boot, in the needs below
let s = 31
const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647
const pick = (a) => a[Math.floor(rnd() * a.length)]
const int = (lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1))
const weighted = (p) => { let r = rnd() * p.reduce((a, [, w]) => a + w, 0); for (const [v, w] of p) if ((r -= w) <= 0) return v; return p[0][0] }
const TODAY = '2026-11-02'
const add = (n) => new Date(new Date(TODAY + 'T12:00:00').getTime() + n * 864e5).toISOString().slice(0, 10)
const inr = (v) => Z.cmoney(v)

// ₹ a kg, and the days a supplier takes
const MATS = {
  neem: { name: 'Neem leaf powder', kg: 180, stock: 14, use: 1.1, lead: 6, supplier: 'Shree Herbs, Indore' },
  clove: { name: 'Clove', kg: 1150, stock: 3.2, use: 0.22, lead: 10, supplier: 'Malabar Spice Co.' },
  rocksalt: { name: 'Rock salt', kg: 40, stock: 22, use: 0.9, lead: 4, supplier: 'Local wholesaler' },
  charcoal: { name: 'Activated charcoal', kg: 320, stock: 6, use: 0.4, lead: 7, supplier: 'Carbon Works, Surat' },
  ginger: { name: 'Dry ginger', kg: 420, stock: 2.1, use: 0.35, lead: 9, supplier: 'Malabar Spice Co.' },
  bhringraj: { name: 'Bhringraj', kg: 260, stock: 9, use: 0.6, lead: 8, supplier: 'Shree Herbs, Indore' },
  amla: { name: 'Amla', kg: 210, stock: 11, use: 0.7, lead: 6, supplier: 'Shree Herbs, Indore' },
  coconut: { name: 'Cold-pressed coconut oil', kg: 380, stock: 48, use: 3.4, lead: 5, supplier: 'Kerala Mills' },
  sesame: { name: 'Sesame oil', kg: 290, stock: 12, use: 1.6, lead: 5, supplier: 'Kerala Mills' },
  hibiscus: { name: 'Hibiscus', kg: 340, stock: 1.4, use: 0.3, lead: 12, supplier: 'Shree Herbs, Indore' },
  shikakai: { name: 'Shikakai', kg: 230, stock: 8, use: 0.5, lead: 8, supplier: 'Shree Herbs, Indore' },
  rose: { name: 'Rose petal', kg: 610, stock: 2.6, use: 0.12, lead: 10, supplier: 'Kannauj Attars' },
}
// grams of each material in one pack, plus jar, label and box
const PRODUCTS = [
  { id: 'p0', name: 'Neem tooth powder', line: 'Oral care', size: '100 g', mrp: 150, gst: 12, f: { neem: 55, clove: 4, rocksalt: 30, rose: 1 }, pack: 14, sold: 412 },
  { id: 'p1', name: 'Charcoal tooth powder', line: 'Oral care', size: '100 g', mrp: 180, gst: 12, f: { charcoal: 40, neem: 25, clove: 5, rocksalt: 25 }, pack: 14, sold: 288 },
  { id: 'p2', name: 'Ginger clove tooth powder', line: 'Oral care', size: '100 g', mrp: 140, gst: 12, f: { ginger: 30, clove: 8, rocksalt: 40, neem: 15 }, pack: 14, sold: 196 },
  { id: 'p3', name: 'Bhringraj hair oil', line: 'Hair care', size: '200 ml', mrp: 340, gst: 18, f: { coconut: 140, bhringraj: 18, amla: 12, hibiscus: 6 }, pack: 26, sold: 351 },
  { id: 'p4', name: 'Amla hair oil', line: 'Hair care', size: '200 ml', mrp: 300, gst: 18, f: { coconut: 120, sesame: 40, amla: 22 }, pack: 26, sold: 244 },
  { id: 'p5', name: 'Hibiscus hair pack', line: 'Hair care', size: '150 g', mrp: 260, gst: 18, f: { hibiscus: 40, shikakai: 50, amla: 40, rose: 6 }, pack: 18, sold: 132 },
  { id: 'p6', name: 'Shikakai hair wash powder', line: 'Hair care', size: '200 g', mrp: 220, gst: 18, f: { shikakai: 110, amla: 50, neem: 30 }, pack: 16, sold: 175 },
]
const OPS = 18, SHIP = 22, RETAIL = 0.3, FLOOR = 35
// today's price is the stock table's, so a correction or undo moves prices and margins together
const price = (m) => Z.row('stock', m)?.kg ?? MATS[m].kg
const costing = (p) => {
  const ex = p.mrp / (1 + p.gst / 100), mat = Object.entries(p.f).reduce((a, [m, g]) => a + (price(m) * g) / 1000, 0), total = mat + p.pack + OPS + SHIP
  return { ex, mat, total, d2c: (ex - total) / ex, retail: (ex * (1 - RETAIL) - (total - SHIP)) / (ex * (1 - RETAIL)) }
}
const refresh = (Z) => {
  Z.rows('products').forEach((r) => { const c = costing(r); Object.assign(r, { cost: Math.round(c.total), margin: Math.round(c.d2c * 100), rmargin: Math.round(c.retail * 100), health: c.d2c * 100 < FLOOR ? 'Under 35%' : c.d2c * 100 < 45 ? 'Thin' : 'Healthy' }) })
  Z.rows('stock').forEach((r) => { r.days = Math.floor(r.stock / r.use); r.state = r.days <= r.lead ? 'Order now' : r.days <= r.lead * 2 ? 'Watch' : 'Enough' })
}
const products = PRODUCTS.map((p) => ({ ...p }))

const CITIES = [['Pune', 'MH', 18.52, 73.86, 9], ['Mumbai', 'MH', 19.08, 72.88, 8], ['Nashik', 'MH', 20.0, 73.79, 3], ['Nagpur', 'MH', 21.15, 79.09, 2], ['Bengaluru', 'KA', 12.97, 77.59, 6], ['Indore', 'MP', 22.72, 75.86, 2], ['Jaipur', 'RJ', 26.91, 75.79, 2], ['Hyderabad', 'TS', 17.39, 78.49, 4], ['Ahmedabad', 'GJ', 23.02, 72.57, 3], ['Delhi', 'DL', 28.61, 77.21, 4], ['Chennai', 'TN', 13.08, 80.27, 3], ['Kochi', 'KL', 9.93, 76.27, 2], ['Kolkata', 'WB', 22.57, 88.36, 2], ['Lucknow', 'UP', 26.85, 80.95, 1], ['Goa', 'GA', 15.5, 73.83, 2], ['Chandigarh', 'CH', 30.73, 76.78, 1]]
const INDIA = [[35.5, 74.5], [34.5, 78], [32.5, 79], [30.5, 81], [28.7, 84], [27.5, 88], [26.8, 92], [28, 95.5], [27, 97], [24.5, 94.5], [22, 93], [23.5, 91.5], [22, 89], [21.5, 87], [19.5, 85], [17.5, 83], [15.8, 81], [13.5, 80.3], [10.3, 79.8], [8.1, 77.5], [8.9, 76.5], [11.5, 75.5], [14.5, 74.3], [17, 73.3], [19, 72.8], [21, 72.6], [22.3, 69], [23.7, 68.2], [24.5, 71], [27, 70], [30, 73.5], [32.5, 74.5], [34.3, 73.8]]
const FIRST = ['Anjali', 'Rohan', 'Meera', 'Kabir', 'Sneha', 'Arjun', 'Pooja', 'Vikram', 'Ishita', 'Nikhil', 'Kavya', 'Rahul', 'Divya', 'Sahil', 'Tanvi', 'Aditya', 'Neha', 'Siddharth']
const LAST = ['Kulkarni', 'Deshpande', 'Iyer', 'Shah', 'Rao', 'Joshi', 'Menon', 'Patil', 'Bhatt', 'Nair', 'Gupta', 'Reddy']
const RETAILERS = ["Green Basket Organics", 'Ayur Mart', "Nature's Shelf", 'Prakriti Stores', 'Desi Haat']
const customers = [
  ...Array.from({ length: 30 }, (_, i) => { const [city, st, lat, lng] = weighted(CITIES.map((c) => [c, c[4]])); return { id: 'u' + i, name: `${pick(FIRST)} ${pick(LAST)}`, kind: 'Customer', city, st, lat, lng, orders: 0, spent: 0, due: 0, dueDays: 0, since: add(-int(20, 400)), last: '' } }),
  ...RETAILERS.map((n, i) => { const [city, st, lat, lng] = CITIES[[0, 1, 4, 0, 8][i]]; return { id: 'rt' + i, name: n, kind: 'Retailer', city, st, lat, lng, orders: 0, spent: 0, due: [42000, 18500, 0, 63200, 9800][i], dueDays: [48, 22, 0, 71, 12][i], since: add(-int(200, 600)), last: '' } }),
]
const STATES = ['Draft', 'Confirmed', 'Packed', 'Shipped', 'Delivered']
const orders = Array.from({ length: 72 }, (_, i) => {
  const c = i % 6 === 0 ? customers[30 + (i / 6) % 5] : customers[i % 30], ago = Math.floor((i / 72) * 58)
  const ch = c.kind === 'Retailer' ? 'Retailer' : weighted([['WhatsApp', 6], ['Website', 3]])
  const p = products[(i * 5) % products.length], p2 = products[(i * 3 + 2) % products.length]
  const qty = c.kind === 'Retailer' ? int(12, 48) : int(1, 3), q2 = c.kind === 'Retailer' ? 0 : int(0, 2)
  const amount = Math.round((qty * p.mrp + q2 * p2.mrp) * (c.kind === 'Retailer' ? 1 - RETAIL : 1))
  const placed = add(-ago), state = ago > 6 ? 'Delivered' : ago > 3 ? 'Shipped' : ago > 1 ? 'Packed' : 'Confirmed'
  c.orders++; c.spent += amount; if (placed > c.last) c.last = placed
  return { id: 'o' + i, no: `VH-${2425 - i}`, customer: c.name, cid: c.id, channel: ch, items: `${qty} × ${p.name}${q2 && p2 !== p ? `, ${q2} × ${p2.name}` : ''}`, amount, placed, state, paid: c.kind === 'Retailer' ? (ago > 45 && c.due ? 'On credit' : 'Paid') : state === 'Confirmed' && i % 3 === 0 ? 'UPI link sent' : 'Paid', city: c.city, st: c.st, lat: c.lat + (rnd() - 0.5) * 0.5, lng: c.lng + (rnd() - 0.5) * 0.5 }
})
const stock = Object.entries(MATS).map(([id, m]) => ({ id, ...m }))
const MONTHS = ['Jun', 'Jul', 'Aug', 'Sep', 'Oct']
const byChannel = { WhatsApp: [190000, 220000, 240000, 280000, 330000], Website: [80000, 90000, 110000, 120000, 140000], Retailer: [140000, 150000, 140000, 190000, 210000] }

const tables = {
  orders: { name: 'Orders', one: 'order', title: 'no', rows: orders, sort: ['placed', 'desc'], view: 'map', board: 'state', date: 'placed',
    lists: [{ name: 'To pack today', tone: 'o1', where: (r) => r.state === 'Confirmed' }, { name: 'WhatsApp', tone: 'good', where: (r) => r.channel === 'WhatsApp' }, { name: 'Unpaid', tone: 'bad', where: (r) => r.paid !== 'Paid' }],
    sub: (r) => `${Z.esc(r.customer)} · ${Z.esc(r.city)} · ${Z.esc(r.channel)}`,
    map: { lat: 'lat', lng: 'lng', color: 'channel', size: 'amount', tip: ['customer', 'amount', 'state'], bounds: { s: 8, n: 31.5, w: 68.5, e: 89 },
      base: (p) => `<path d="M${INDIA.map(([a, b]) => p(a, b).join(' ')).join('L')}Z" fill="#fffdf9" stroke="#d8cfbf" stroke-width="1.5"/><text x="${p(16, 69.5)[0]}" y="${p(16, 69.5)[1]}" font-size="12" font-style="italic" fill="#9db4c8">Arabian Sea</text><text x="${p(16, 85)[0]}" y="${p(16, 85)[1]}" font-size="12" font-style="italic" fill="#9db4c8">Bay of Bengal</text>`,
      layers: (p) => CITIES.map(([n, , la, ln]) => { const [x, y] = p(la, ln); return `<text x="${x}" y="${y - 12}" text-anchor="middle" font-size="11" font-weight="500" fill="#6f6857" stroke="#fffdf9" stroke-width="3" paint-order="stroke" pointer-events="none">${n}</text>` }).join('') + (() => { const [x, y] = p(18.52, 73.86); return `<g data-tip="Vanya Herbals: workshop and dispatch, Pune"><rect x="${x - 10}" y="${y - 10}" width="20" height="20" rx="5" fill="var(--ink)"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">VH</text></g>` })(),
      legend: '<span><i style="background:var(--ink);border-radius:3px"></i>Your workshop</span>' },
    links: [{ t: 'customers', label: 'Customer', by: (r, x) => x.id === r.cid, show: ['orders', 'due'] }],
    detail: (r) => {
      const gst = r.items.includes('oil') || r.items.includes('pack') || r.items.includes('wash') ? 18 : 12, tax = Math.round(r.amount - r.amount / (1 + gst / 100)), intra = r.st === 'MH'
      return `<div class="callout">${Z.ic('receipt')} <b>GST on this order:</b> ${intra ? `shipped within Maharashtra, so CGST ${Z.money(tax / 2)} + SGST ${Z.money(tax / 2)}` : `shipped to ${Z.esc(r.city)} (${r.st}), another state, so IGST ${Z.money(tax)}`}. The Invoice maker picks this from the ship-to state.</div>`
    },
    fields: [
      { k: 'no', label: 'Order', src: 'Numbered by Zazoo' },
      { k: 'customer', label: 'Customer', src: (r) => (r.channel === 'WhatsApp' ? 'Matched by phone number' : r.channel === 'Website' ? 'Website checkout' : 'Retailer account') },
      { k: 'channel', label: 'Channel', kind: 'choice', choices: ['WhatsApp', 'Website', 'Retailer'], tones: { WhatsApp: 'good', Website: 'o1', Retailer: 'acc' }, src: 'Where the order came in' },
      { k: 'items', label: 'Items', src: (r) => (r.channel === 'WhatsApp' ? 'Read from the WhatsApp message' : 'Order form') },
      { k: 'amount', label: 'Amount', kind: 'money', src: (r) => (r.channel === 'Retailer' ? 'MRP × quantity, less the 30% retailer margin' : 'MRP × quantity') },
      { k: 'placed', label: 'Placed', kind: 'date', src: 'Message or checkout time' },
      { k: 'state', label: 'State', kind: 'choice', choices: STATES, tones: { Draft: 'warn', Confirmed: 'o1', Packed: 'o3', Shipped: 'acc', Delivered: 'good' }, src: 'Packing desk and the courier feed' },
      { k: 'paid', label: 'Payment', kind: 'choice', choices: ['Paid', 'UPI link sent', 'On credit'], tones: { Paid: 'good', 'UPI link sent': 'warn', 'On credit': 'o8' }, src: 'Matched from the bank statement by amount and order number' },
      { k: 'city', label: 'Ship to', src: "The customer's address" },
    ] },
  customers: { name: 'Customers', one: 'customer', title: 'name', rows: customers, sort: ['spent', 'desc'], view: 'table', board: 'kind', date: 'last',
    lists: [{ name: 'Retailers', tone: 'acc', where: (r) => r.kind === 'Retailer' }, { name: 'Owe you', tone: 'bad', where: (r) => r.due > 0 }, { name: 'Due to reorder', tone: 'o1', where: (r) => r.kind === 'Customer' && Z.daysFrom(r.last) <= -40, tip: 'Last order 40 days ago or more: tooth powder runs out in about 45' }],
    sub: (r) => `${r.kind} in ${Z.esc(r.city)} · since ${Z.day(r.since)}`,
    map: { lat: 'lat', lng: 'lng', color: 'kind', size: 'spent', tip: ['spent', 'orders'], bounds: { s: 8, n: 31.5, w: 68.5, e: 89 }, base: (p) => `<path d="M${INDIA.map(([a, b]) => p(a, b).join(' ')).join('L')}Z" fill="#fffdf9" stroke="#d8cfbf" stroke-width="1.5"/>` },
    links: [{ t: 'orders', label: 'Orders', by: (r, x) => x.cid === r.id, show: ['amount', 'state'] }],
    detail: (r) => (r.dueDays > 45 ? `<div class="callout bad"><b>${Z.money(r.due)} is ${r.dueDays} days old,</b> past your 45-day terms. The Payment chaser has a reminder drafted.</div>` : ''),
    fields: [
      { k: 'name', label: 'Name', src: 'WhatsApp contact or website account' },
      { k: 'kind', label: 'Type', kind: 'choice', choices: ['Customer', 'Retailer'], tones: { Customer: 'o8', Retailer: 'acc' }, src: 'Retailers have a trade account' },
      { k: 'city', label: 'City', src: 'Delivery address' },
      { k: 'orders', label: 'Orders', kind: 'number', computed: true, src: 'Computed: counted from orders' },
      { k: 'spent', label: 'Bought', kind: 'money', computed: true, src: 'Computed: the sum of their orders' },
      { k: 'due', label: 'Owes you', kind: 'money', src: 'Invoices less payments received (UPI and bank)' },
      { k: 'last', label: 'Last order', kind: 'date', src: 'Orders' },
      { k: 'since', label: 'Customer since', kind: 'date', hide: true, src: 'First order' },
    ] },
  products: { name: 'Products', one: 'product', title: 'name', rows: products, sort: ['margin', 'asc'], view: 'card', board: 'health',
    sub: (r) => `${r.size} · MRP ${Z.money(r.mrp)} · GST ${r.gst}% · ${r.sold} sold in October`,
    detail: (r) => {
      const c = costing(r), mats = Object.entries(r.f).map(([m, g]) => ({ label: `${MATS[m].name} · ${g} g`, value: (price(m) * g) / 1000, tip: `${g} g at ${Z.money(price(m))} a kg` }))
      return `${r.margin < FLOOR ? `<div class="callout bad"><b>Under your ${FLOOR}% line.</b> At ${Z.money(r.mrp + 20)} the direct margin would be ${Math.round(costing({ ...r, mrp: r.mrp + 20 }).d2c * 100)}%.</div>` : ''}
      <div class="sec-t">Where the ${Z.money(r.mrp)} goes</div>${Z.chart.hbar([{ label: 'GST', value: r.mrp - c.ex, color: '#8a8f9c' }, { label: 'Herbs and oils', value: c.mat, color: Z.PAL[0] }, { label: 'Jar, label, box', value: r.pack, color: Z.PAL[3] }, { label: 'Making (labour)', value: OPS, color: Z.PAL[4] }, { label: 'Courier', value: SHIP, color: Z.PAL[2] }, { label: 'Yours to keep', value: Math.max(0, c.ex - c.total), color: '#2f7a55' }], { max: r.mrp, fmt: (v) => Z.money(Math.round(v)) })}
      <div class="sec-t">The formula, at today's prices</div>${Z.chart.hbar(mats, { fmt: (v) => Z.money(Math.round(v * 10) / 10) })}<p class="mute3" style="font-size:12px">Correct a herb's price in Raw materials and every product that uses it updates.</p>`
    },
    fields: [
      { k: 'name', label: 'Product', src: 'Your product list' },
      { k: 'line', label: 'Range', kind: 'choice', choices: ['Oral care', 'Hair care'], tones: { 'Oral care': 'o1', 'Hair care': 'o5' }, src: 'Your product list' },
      { k: 'health', label: 'Margin health', kind: 'choice', choices: ['Healthy', 'Thin', 'Under 35%'], tones: { Healthy: 'good', Thin: 'warn', 'Under 35%': 'bad' }, computed: true, src: "Computed against your 35% line" },
      { k: 'mrp', label: 'MRP', kind: 'money', src: 'Printed on the pack' },
      { k: 'cost', label: 'Cost to make and ship', kind: 'money', computed: true, src: "Computed: herbs from the formula at today's prices, plus jar, label, labour and courier" },
      { k: 'margin', label: 'Margin, direct', kind: 'pct', computed: true, help: 'Sold on WhatsApp or the website', src: 'Computed: MRP less GST, less cost' },
      { k: 'rmargin', label: 'Margin, retailer', kind: 'pct', computed: true, help: 'Sold through a shop', src: "Computed: after the retailer's 30%, no courier" },
      { k: 'sold', label: 'Sold in Oct', kind: 'number', src: 'Orders' },

      { k: 'size', label: 'Size', hide: true, src: 'Your product list' },
    ] },
  stock: { name: 'Raw materials', one: 'material', title: 'name', rows: stock, sort: ['days', 'asc'], view: 'table', board: 'state',
    sub: (r) => `From ${Z.esc(r.supplier)} · takes ${r.lead} days`,

    fields: [
      { k: 'name', label: 'Material', src: 'Your materials list' },
      { k: 'state', label: 'Stock', kind: 'choice', choices: ['Order now', 'Watch', 'Enough'], tones: { 'Order now': 'bad', Watch: 'warn', Enough: 'good' }, computed: true, src: "Computed: days left against the supplier's lead time" },
      { k: 'days', label: 'Days left', kind: 'number', computed: true, src: 'Computed: in stock ÷ used a day' },
      { k: 'stock', label: 'In stock', kind: 'number', unit: 'kg', src: 'Last count, less what was made since' },
      { k: 'use', label: 'Used a day', kind: 'number', unit: 'kg', src: 'Average of the last 30 days of making' },
      { k: 'lead', label: 'Supplier takes', kind: 'number', unit: 'days', src: 'From past purchase orders' },
      { k: 'kg', label: '₹ a kg', kind: 'money', help: 'Click to correct it as a supplier would; margins follow', src: 'Last supplier invoice' },
      { k: 'supplier', label: 'Supplier', src: 'Last purchase order' },
    ] },
}

const levels = {

const c2 = customers[2], c5 = customers[5]
const needs = [
  { id: 'w1', agent: 'WhatsApp order taker', module: 'orders', level: 'B', roles: ['founder', 'ops'], date: '8:42',
    title: `New WhatsApp order from ${c2.name}: ${Z.money(3 * 150 + 2 * 300)}`, quote: 'Hi, need 3 neem tooth powder and 2 amla oil. Same address as last time. Will pay on GPay 🙏', quoteFrom: `WhatsApp · 8:42 am · ${c2.city}`,

      { label: 'Ask first', run: () => `asked ${c2.name} to check the order`, done: 'Asked' }] },

const mini = (rows, cells) => `<div class="mini"><table><tbody>${rows.map((r) => `<tr>${cells(r).map((c, i) => `<td class="${i ? 'n' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
const ask = [
  { q: 'Which product makes me the least money?', keys: ['least', 'margin', 'money', 'profit'], reads: 'products and formulas', a: (Z) => { const p = [...Z.rows('products')].sort((a, b) => a.margin - b.margin)[0]; return `${p.name}: ${p.margin}% sold direct, ${p.rmargin}% through a shop. Its herbs and oils cost ${Z.money(Math.round(costing(p).mat))} a pack. Open it in Products to see where the ${Z.money(p.mrp)} goes.` } },
  { q: 'Who owes me money?', keys: ['owe', 'due', 'payment', 'pending'], roles: ['founder'], reads: 'invoices and payments', a: (Z) => { const rows = Z.rows('customers').filter((c) => c.due > 0).sort((a, b) => b.dueDays - a.dueDays); return `${inr(rows.reduce((a, c) => a + c.due, 0))} across ${rows.length} retailers:${mini(rows, (c) => [Z.esc(c.name), `${c.dueDays} days`, Z.money(c.due)])}` } },
  { q: 'What will run out this week?', keys: ['run out', 'stock', 'week', 'reorder'], reads: 'raw materials', a: (Z) => { const rows = Z.rows('stock').filter((r) => r.days <= 7); return `${rows.length} herbs run out within 7 days:${mini(rows, (r) => [Z.esc(r.name), `${r.days} days left`, `supplier takes ${r.lead}`])}` } },

]

const overview = {
  orders: (Z) => {
    const os = Z.rows('orders'), cs = Z.rows('customers'), due = cs.reduce((a, c) => a + c.due, 0)
    const days = Array.from({ length: 14 }, (_, i) => add(i - 13)), daily = days.map((d) => os.filter((o) => o.placed === d).reduce((a, o) => a + o.amount, 0))
    return `<div class="counts">${Z.count(os.filter((o) => o.state === 'Confirmed').length, 'orders to pack', 'Open on the map', 'data-act="tab" data-k="orders"')}${Z.count(inr(os.filter((o) => Z.daysFrom(o.placed) > -30).reduce((a, o) => a + o.amount, 0)), 'sales, last 30 days')}${Z.count(inr(due), 'retailers owe you')}${Z.count('41%', 'customers who reorder within 60 days')}</div>
    <div class="cols2">${Z.box('Sales by channel', Z.chart.line(Object.entries(byChannel).map(([name, values]) => ({ name, values })), MONTHS, { fmt: inr }))}${Z.box('Sales a day, last two weeks', Z.chart.bar(daily.map((v, i) => ({ label: Z.day(days[i]).replace(/^\w+ /, ''), value: v, tone: i === 13 ? 'acc' : 'o1' })), { fmt: inr }))}</div>
    <div class="cols2">${Z.box('Orders by state', Z.chart.donut(STATES.map((st, i) => ({ label: st, value: os.filter((o) => o.state === st).length, color: ['#b5832e', '#2f5f8a', '#7a5c99', '#c4602f', '#2f7a55'][i] })), { center: os.length, sub: 'orders', fmt: (v) => v }))}${Z.box('Who owes you, by age', Z.chart.hbar(cs.filter((c) => c.due > 0).sort((a, b) => b.dueDays - a.dueDays).map((c) => ({ label: c.name, value: c.due, tone: c.dueDays > 60 ? 'bad' : c.dueDays > 45 ? 'warn' : 'good', note: c.dueDays + ' d', row: ['customers', c.id] })), { fmt: inr }), '', 'Your terms are 45 days')}</div>`
  },
  products: (Z) => {
    const ps = Z.rows('products'), avg = Math.round(ps.reduce((a, p) => a + p.margin * p.sold, 0) / ps.reduce((a, p) => a + p.sold, 0))
    return `<div class="counts">${Z.count(avg + '%', 'average margin, direct', 'Products', 'data-act="tab" data-k="products"')}${Z.count(ps.filter((p) => p.margin < FLOOR).length, `products under your ${FLOOR}%`)}${Z.count(ps.reduce((a, p) => a + p.sold, 0).toLocaleString('en-IN'), 'packs sold in October')}${Z.count(Z.rows('stock').filter((r) => r.state === 'Order now').length, 'herbs to order now', 'Raw materials', 'data-act="tab" data-k="stock"')}</div>
    <div class="cols2">${Z.box('Margin by product, sold direct', Z.chart.hbar(ps.map((p) => ({ label: p.name, value: p.margin, tone: p.margin < FLOOR ? 'bad' : p.margin < 45 ? 'warn' : 'good', mark: FLOOR, row: ['products', p.id] })), { max: 70, fmt: (v) => v + '%' }), '', `The line is ${FLOOR}%, the margin you said you won't go under`)}${Z.box("Herb prices, ₹ a kg", `<div class="weights">${Z.rows('stock').map((m) => `<label><span>${Z.esc(m.name)}</span><input type="number" min="1" value="${m.kg}" data-mat="${m.id}" aria-label="${Z.esc(m.name)}, ₹ a kg" style="height:30px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface)"></label>`).join('')}</div>`, '', 'Change a price as a supplier would; every margin follows')}</div>
    <div class="cols2">${Z.box('Days left against supplier lead time', Z.chart.hbar(Z.rows('stock').map((r) => ({ label: r.name, value: r.days, mark: r.lead, tone: r.state === 'Order now' ? 'bad' : r.state === 'Watch' ? 'warn' : 'good', row: ['stock', r.id] })), { max: 40, fmt: (v) => v + ' d' }), '', "The line is the supplier's lead time: red runs out before a new order would arrive")}${Z.box('October units, by product', Z.chart.donut(ps.map((p) => ({ label: p.name, value: p.sold })), { center: ps.reduce((a, p) => a + p.sold, 0), sub: 'packs', fmt: (v) => v }))}</div>`
  },
}

  brief: (Z, r) => `<b>Morning.</b> ${r === 'ops' ? `${Z.rows('orders').filter((o) => o.state === 'Confirmed').length} orders to pack for the 4 pm courier, and hibiscus runs out in 4 days.` : 'Overnight 9 GST invoices went out and 6 UPI payments were matched. Two WhatsApp orders wait for you, one Zazoo could not read for sure.'}<br><br><span class="mute3">Try: confirm the WhatsApp order · open <b>Orders</b> for the map of India, then change the view · in <b>Products and stock</b>, raise a herb's price and watch the margins · run the Margin watch from <b>Agents</b>.</span>`,
  why: `<p style="font-size:14px">Zazoo runs on the workshop's own computer. Customers' numbers, formulas and sales never leave it.</p><ul style="margin:14px 0 0 18px;font-size:14px;line-height:1.8"><li>WhatsApp Business, the website and the bank statement stay where they are; Zazoo reads them.</li><li>Your formulas are your recipes: they are never sent anywhere.</li><li>Zazoo's team keeps it running and updated; you never maintain software.</li></ul>`,
  onChange: (el, Z) => {

    Z.render()
  },
